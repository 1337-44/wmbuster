name: Android NanoCUL GPS Logger

on:
  push:
    paths:
      - 'android/NanoCulLogger/**'
      - '.github/workflows/android-nanocul.yml'
  pull_request:
    paths:
      - 'android/NanoCulLogger/**'
      - '.github/workflows/android-nanocul.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept licenses and install Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests and debug APK
        run: gradle -p android/NanoCulLogger :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NanoCulLogger-debug-apk
          path: android/NanoCulLogger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package independent Android repository
        run: |
          mkdir -p /tmp/nanocul-repository
          rsync -a --exclude='.gradle' --exclude='build' --exclude='.idea' \
            android/NanoCulLogger/ /tmp/nanocul-repository/
          mkdir -p /tmp/nanocul-repository/distribution
          cp android/NanoCulLogger/app/build/outputs/apk/debug/app-debug.apk \
            /tmp/nanocul-repository/distribution/NanoCUL_GPS_Logger_debug.apk
          cd /tmp
          zip -qr "${GITHUB_WORKSPACE}/NanoCUL_GPS_Logger_standalone.zip" nanocul-repository
      - name: Upload independent project with APK
        uses: actions/upload-artifact@v4
        with:
          name: NanoCUL-GPS-Logger-standalone
          path: NanoCUL_GPS_Logger_standalone.zip
          if-no-files-found: error
